        /* Custom scrollbar and glassmorphism */
        ::-webkit-scrollbar { width: 8px; }

        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.6); }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);

            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);

        .key-cap {
            transition: all 0.08s ease;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
        }
        .key-cap.active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.3);
        }

        /* Pulsing cursor animation */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background-color: #38bdf8;
            vertical-align: middle;
            animation: blink 0.9s infinite;
        }

        /* Shake animation on error */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake-err {
            animation: shake 0.3s ease-in-out;
        }

        .kiwi-peek {
            position: absolute;
            right: 2rem;
            bottom: -5rem;
            z-index: 10;
            width: clamp(5rem, 15vw, 8rem);
            height: auto;
            opacity: 0;
            pointer-events: none;
        }

        .kiwi-peek.is-peeking {
            animation: kiwi-peek 0.65s cubic-bezier(0.2, 0.8, 0.25, 1.2) both;
        }

        @keyframes kiwi-peek {
            0% { opacity: 0; transform: translateY(65%) scale(0.8); }
            65% { opacity: 1; transform: translateY(-8%) scale(1.05); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .kiwi-peek.is-peeking { animation: none; opacity: 1; }
        }

        /**
         * AUDIO ENGINE (Tone.js wrapper)
         */
        class SoundController {
            constructor() {
                this.enabled = true;
                this.synth = null;
                this.init();
            }

            init() {
                try {
                    this.synth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.005, decay: 0.1, sustain: 0.0, release: 0.1 }
                    }).toDestination();
                    this.synth.volume.value = -12;
                } catch(e) {
                    console.log("Audio init deferred");
                }
            }

            playKeySound() {
                if (!this.enabled) return;
                try {
                    Tone.start();
                    this.synth.triggerAttackRelease("C5", "32n");
                } catch(e){}
            }

            playErrorSound() {
                if (!this.enabled) return;
                try {
                    Tone.start();
                    this.synth.triggerAttackRelease("A2", "16n");
                } catch(e){}
            }

            playCompleteSound() {
                if (!this.enabled) return;
                try {
                    Tone.start();
                    const now = Tone.now();
                    this.synth.triggerAttackRelease("C5", "16n", now);
                    this.synth.triggerAttackRelease("E5", "16n", now + 0.08);
                    this.synth.triggerAttackRelease("G5", "16n", now + 0.16);
                    this.synth.triggerAttackRelease("C6", "8n", now + 0.24);
                } catch(e){}
            }
        }

        /**
         * KANA TO ROMAJI CONVERTER LOGIC
         * Parses kana into target nodes capable of matching multiple valid Romaji typing styles.
         */
        function parseKanaToRomajiNodes(kanaStr) {
            kanaStr = Array.from(kanaStr.normalize("NFKC"), char => {
                const code = char.charCodeAt(0);
                return code >= 0x30A1 && code <= 0x30F6
                    ? String.fromCharCode(code - 0x60)
                    : char;
            }).join("");

            let nodes = [];
            let i = 0;

            while (i < kanaStr.length) {
                // Check compound 2-char kana (e.g. しゃ, きゅ)
                if (i + 1 < kanaStr.length) {
                    let pair = kanaStr.substring(i, i + 2);
                    if (ROMAJI_MAP[pair]) {
                        nodes.push({ kana: pair, options: [...ROMAJI_MAP[pair]] });
                        i += 2;
                        continue;
                    }
                }

                let single = kanaStr[i];

                // Handle Sokuon (っ) specially based on following character
                if (single === 'っ' && i + 1 < kanaStr.length) {
                    let nextKana = kanaStr[i + 1];
                    let nextOptions = ROMAJI_MAP[nextKana] || [];
                    if (nextKana === 'しゃ' || nextKana === 'しゅ' || nextKana === 'しょ') nextOptions = ROMAJI_MAP[nextKana];

                    let sokuonConsonants = [];
                    if (nextOptions.length > 0) {
                        nextOptions.forEach(opt => {
                            sokuonConsonants.push(opt[0]); // first letter repeats
                        });
                    }
                    // Default fallback options for 'っ'
                    sokuonConsonants.push('xtu', 'ltu');

                    nodes.push({ kana: 'っ', options: Array.from(new Set(sokuonConsonants)) });
                    i++;
                    continue;
                }

                if (ROMAJI_MAP[single]) {
                    nodes.push({ kana: single, options: [...ROMAJI_MAP[single]] });
                } else {
                    // Alphabet / numbers fallback
                    nodes.push({ kana: single, options: [single.toLowerCase()] });
                }
                i++;
            }

            return nodes;
        }

        /**
         * GAME STATE & LOGIC
         */
        class TypingGame {
            constructor() {
                this.questions = [];
                this.currentIndex = 0;
                this.isStarted = false;
                this.isFinished = false;

                // Typing tracking state
                this.kanaNodes = [];
                this.nodeIndex = 0;
                this.targetRomaji = "";
                this.typedInCurrentNode = "";

                // Display tracking string
                this.completedRomaji = "";
                this.remainingRomaji = "";

                // Stats
                this.totalKeystrokes = 0;
                this.correctKeystrokes = 0;
                this.errors = 0;
                this.startTime = null;
                this.timerInterval = null;
                this.countdownTimeout = null;
                this.isCountdown = false;

                // DOM Elements
                this.initDOMElements();
                this.setupVirtualKeyboard();
                this.bindEvents();
                this.loadCategory();
            }

            initDOMElements() {
                this.targetKanjiEl = document.getElementById("targetKanji");
                this.targetKanaEl = document.getElementById("targetKana");
                this.kiwiPeekImageEl = document.getElementById("kiwiPeekImage");
                this.romajiDisplayEl = document.getElementById("romajiDisplay");
                this.startPromptEl = document.getElementById("startPrompt");
                this.startPromptContentEl = document.getElementById("startPromptContent");
                this.countdownDisplayEl = document.getElementById("countdownDisplay");
                this.typingCardEl = document.getElementById("typingCard");
                this.progressBarEl = document.getElementById("progressBar");

                this.cpmValEl = document.getElementById("cpmVal");
                this.accuracyValEl = document.getElementById("accuracyVal");
                this.errorValEl = document.getElementById("errorVal");
                this.timerValEl = document.getElementById("timerVal");
                this.questionCountEl = document.getElementById("questionCount");

                this.restartBtn = document.getElementById("restartBtn");
                this.soundToggleBtn = document.getElementById("soundToggleBtn");
                this.themeToggleBtn = document.getElementById("themeToggleBtn");

                this.resultModal = document.getElementById("resultModal");
                this.resultCard = document.getElementById("resultModalCard");
                this.retryBtn = document.getElementById("retryBtn");
                this.shareBtn = document.getElementById("shareBtn");
            }

            loadCategory() {
                this.shuffleQuestions();
                this.resetGame();
            }

            shuffleQuestions() {
                const dataset = DATASETS.meme;
                const shuffled = [...dataset];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const randomIndex = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[i]];
                }
                this.questions = shuffled.slice(0, 10);
            }

            restartGame() {
                this.shuffleQuestions();
                this.resetGame();
            }

            resetGame() {
                clearInterval(this.timerInterval);
                clearTimeout(this.countdownTimeout);
                this.countdownTimeout = null;
                this.currentIndex = 0;
                this.isStarted = false;
                this.isCountdown = false;
                this.isFinished = false;

                this.totalKeystrokes = 0;
                this.correctKeystrokes = 0;
                this.errors = 0;
                this.startTime = null;

                this.cpmValEl.textContent = "0";
                this.accuracyValEl.textContent = "100%";
                this.errorValEl.textContent = "0";
                this.timerValEl.textContent = "0.0s";
                this.progressBarEl.style.width = "0%";

                this.startPromptContentEl.classList.remove("hidden");
                this.countdownDisplayEl.classList.add("hidden");
                this.countdownDisplayEl.textContent = "";
                this.startPromptEl.classList.remove("opacity-0", "pointer-events-none");
                this.hideResultModal();

                this.setupCurrentQuestion();
            }

            setupCurrentQuestion() {
                if (this.currentIndex >= this.questions.length) {
                    this.finishGame();
                    return;
                }

                const current = this.questions[this.currentIndex];
                this.targetKanjiEl.textContent = current.kanji;
                this.targetKanaEl.textContent = current.kana;
                this.kiwiPeekImageEl.classList.remove("is-peeking");
                if (this.isStarted) this.playKiwiPeek();

                this.kanaNodes = parseKanaToRomajiNodes(current.kana);
                this.nodeIndex = 0;
                this.typedInCurrentNode = "";
                this.completedRomaji = "";

                this.questionCountEl.textContent = `Question ${this.currentIndex + 1} / ${this.questions.length}`;
                this.updateProgressBar();
                this.renderRomajiDisplay();
            }

            playKiwiPeek() {
                if (this.questions[this.currentIndex]?.kanji !== "キュウリ植えてもいいですか？") return;
                void this.kiwiPeekImageEl.offsetWidth;
                this.kiwiPeekImageEl.classList.add("is-peeking");
            }

            renderRomajiDisplay() {
                if (this.nodeIndex >= this.kanaNodes.length) return;

                const currentNode = this.kanaNodes[this.nodeIndex];
                // Select default display option (first available option)
                const defaultCurrentOption = currentNode.options[0];
                const uncompletedInNode = defaultCurrentOption.substring(this.typedInCurrentNode.length);

                let upcomingRomaji = "";
                for (let i = this.nodeIndex + 1; i < this.kanaNodes.length; i++) {
                    upcomingRomaji += this.kanaNodes[i].options[0];
                }

                // Construct styled Romaji string
                this.romajiDisplayEl.innerHTML = `
                    <span class="text-sky-400 font-semibold">${this.escapeHTML(this.completedRomaji)}</span><span class="bg-sky-500/20 text-sky-200 border-b-2 border-sky-400 font-bold">${this.escapeHTML(this.typedInCurrentNode)}</span><span class="typing-cursor"></span><span class="text-slate-400">${this.escapeHTML(uncompletedInNode)}</span><span class="text-slate-600">${this.escapeHTML(upcomingRomaji)}</span>
                `;
            }

            escapeHTML(str) {
                return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }

            handleKeyPress(key) {
                if (this.isFinished) return;

                if (!this.isStarted) {
                    if (!this.isCountdown) this.startCountdown();
                    return;
                }

                // Visual key press on virtual keyboard
                this.animateVirtualKey(key);

                const currentNode = this.kanaNodes[this.nodeIndex];
                const inputChar = key.toLowerCase();

                // Check match against options in current node
                let matched = false;
                let matchedOption = null;

                for (let opt of currentNode.options) {
                    if (opt.startsWith(this.typedInCurrentNode + inputChar)) {
                        matched = true;
                        matchedOption = opt;
                        break;
                    }
                }

                this.totalKeystrokes++;

                if (matched) {
                    sounds.playKeySound();
                    this.correctKeystrokes++;
                    this.typedInCurrentNode += inputChar;

                    // If full option matched
                    if (this.typedInCurrentNode === matchedOption) {
                        this.completedRomaji += matchedOption;
                        this.typedInCurrentNode = "";
                        this.nodeIndex++;

                        if (this.nodeIndex >= this.kanaNodes.length) {
                            // Question finished
                            sounds.playKeySound();
                            this.currentIndex++;
                            setTimeout(() => this.setupCurrentQuestion(), 60);
                            return;
                        }
                    }
                } else {
                    // Mistake made
                    sounds.playErrorSound();
                    this.errors++;
                    this.triggerErrorAnimation();
                }

                this.updateMetrics();
                this.renderRomajiDisplay();
            }

            startCountdown() {
                this.isCountdown = true;
                this.startPromptContentEl.classList.add("hidden");
                this.countdownDisplayEl.classList.remove("hidden");
                this.countdownDisplayEl.textContent = "3";

                const steps = ["2", "1", "START"];
                const showStep = (index) => {
                    if (index < steps.length) {
                        this.countdownDisplayEl.textContent = steps[index];
                        this.countdownTimeout = setTimeout(() => showStep(index + 1), 1000);
                        return;
                    }

                    this.startPromptEl.classList.add("opacity-0", "pointer-events-none");
                    this.countdownTimeout = setTimeout(() => {
                        this.countdownDisplayEl.classList.add("hidden");
                        this.isCountdown = false;
                        this.isStarted = true;
                        this.startTime = Date.now();
                        this.startTimer();
                        this.playKiwiPeek();
                    }, 300);
                };

                this.countdownTimeout = setTimeout(() => showStep(0), 1000);
            }

            triggerErrorAnimation() {
                this.typingCardEl.classList.add("shake-err", "border-rose-500/50");
                setTimeout(() => {
                    this.typingCardEl.classList.remove("shake-err", "border-rose-500/50");
                }, 300);
            }

            startTimer() {
                this.timerInterval = setInterval(() => {
                    if (!this.startTime) return;
                    const elapsedSec = (Date.now() - this.startTime) / 1000;
                    this.timerValEl.innerHTML = `${elapsedSec.toFixed(1)}<span class="text-xs">s</span>`;
                    this.updateMetrics();
                }, 100);
            }

            updateMetrics() {
                if (!this.startTime) return;
                const elapsedMin = (Date.now() - this.startTime) / 60000;
                
                // CPM (Characters Per Minute)
                const cpm = elapsedMin > 0 ? Math.round(this.correctKeystrokes / elapsedMin) : 0;
                this.cpmValEl.textContent = cpm;

                // Accuracy
                const acc = this.totalKeystrokes > 0 
                    ? Math.max(0, Math.round((this.correctKeystrokes / this.totalKeystrokes) * 100)) 
                    : 100;
                this.accuracyValEl.innerHTML = `${acc}<span class="text-xs">%</span>`;

                // Errors
                this.errorValEl.textContent = this.errors;
            }

            updateProgressBar() {
                const percent = ((this.currentIndex) / this.questions.length) * 100;
                this.progressBarEl.style.width = `${percent}%`;
            }

            finishGame() {
                clearInterval(this.timerInterval);
                this.isFinished = true;
                this.progressBarEl.style.width = "100%";
                sounds.playCompleteSound();

                // Trigger Confetti
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 80,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }

                this.showResultModal();
            }

            showResultModal() {
                const elapsedSec = ((Date.now() - this.startTime) / 1000).toFixed(1);
                const elapsedMin = (Date.now() - this.startTime) / 60000;
                const cpm = elapsedMin > 0 ? Math.round(this.correctKeystrokes / elapsedMin) : 0;
                const acc = this.totalKeystrokes > 0 
                    ? ((this.correctKeystrokes / this.totalKeystrokes) * 100).toFixed(1) 
                    : "100.0";

                document.getElementById("finalCpm").textContent = cpm;
                document.getElementById("finalAccuracy").textContent = `${acc}%`;
                document.getElementById("finalTime").textContent = `${elapsedSec}s`;
                document.getElementById("finalErrors").textContent = `${this.errors} 回`;

                // Rank Calculation
                let rank = "C";
                let rankTitle = "ビギナータイピスト";
                let badgeClass = "from-slate-400 to-slate-600";

                if (cpm >= 300 && acc >= 90) {
                    rank = "S";
                    rankTitle = "神速のタイピングマスター";
                    badgeClass = "from-amber-400 to-amber-600";
                } else if (cpm >= 250 && acc >= 90) {
                    rank = "A";
                    rankTitle = "上級タイピスト";
                    badgeClass = "from-sky-400 to-indigo-600";
                } else if (cpm >= 150 && acc >= 85) {
                    rank = "B";
                    rankTitle = "中級タイピスト";
                    badgeClass = "from-emerald-400 to-teal-600";
                }

                const rankBadgeNode = document.getElementById("rankBadge");
                rankBadgeNode.textContent = rank;
                rankBadgeNode.className = `w-24 h-24 rounded-full bg-gradient-to-tr ${badgeClass} text-slate-950 font-black text-5xl flex items-center justify-center shadow-xl mx-auto`;
                document.getElementById("rankTitle").textContent = rankTitle;

                this.resultModal.classList.remove("opacity-0", "pointer-events-none");
                this.resultCard.classList.remove("scale-95");
                this.resultCard.classList.add("scale-100");
            }

            hideResultModal() {
                this.resultModal.classList.add("opacity-0", "pointer-events-none");
                this.resultCard.classList.remove("scale-100");
                this.resultCard.classList.add("scale-95");
            }

            setupVirtualKeyboard() {
                const keyboardEl = document.getElementById("virtualKeyboard");
                const rows = [
                    ["q","w","e","r","t","y","u","i","o","p"],
                    ["a","s","d","f","g","h","j","k","l"],
                    ["z","x","c","v","b","n","m","-"]
                ];

                keyboardEl.innerHTML = "";
                rows.forEach(row => {
                    const rowDiv = document.createElement("div");
                    rowDiv.className = "flex justify-center gap-1 sm:gap-1.5";
                    row.forEach(key => {
                        const keyCap = document.createElement("div");
                        keyCap.dataset.key = key;
                        keyCap.className = "key-cap w-8 h-9 sm:w-10 sm:h-10 bg-slate-800/90 border border-slate-700/80 rounded-lg flex items-center justify-center text-xs sm:text-sm font-mono font-semibold text-slate-300 uppercase select-none";
                        keyCap.textContent = key;
                        rowDiv.appendChild(keyCap);
                    });
                    keyboardEl.appendChild(rowDiv);
                });
            }

            animateVirtualKey(key) {
                const keyNode = document.querySelector(`.key-cap[data-key="${key.toLowerCase()}"]`);
                if (keyNode) {
                    keyNode.classList.add("active", "bg-sky-500", "text-white");
                    setTimeout(() => {
                        keyNode.classList.remove("active", "bg-sky-500", "text-white");
                    }, 120);
                }
            }

            bindEvents() {
                // Keyboard Input
                window.addEventListener("keydown", (e) => {
                    if (e.key === "Escape") {
                        this.restartGame();
                        return;
                    }

                    // Ignore control key combinations
                    if (e.ctrlKey || e.altKey || e.metaKey) return;

                    // Space or Single Printable Characters
                    if (e.key === " " || (e.key.length === 1 && e.key.match(/[a-zA-Z0-9\-\,\.\!\?]/))) {
                        e.preventDefault();
                        this.handleKeyPress(e.key);
                    }
                });

                // Controls
                this.restartBtn.addEventListener("click", () => this.restartGame());
                this.retryBtn.addEventListener("click", () => this.restartGame());

                // Sound Toggle
                this.soundToggleBtn.addEventListener("click", () => {
                    sounds.enabled = !sounds.enabled;
                    const icon = document.getElementById("soundIcon");
                    icon.className = sounds.enabled ? "fa-solid fa-volume-high text-lg" : "fa-solid fa-volume-xmark text-lg text-slate-500";
                });

                // Theme Toggle
                this.themeToggleBtn.addEventListener("click", () => {
                    document.documentElement.classList.toggle("dark");
                    document.documentElement.classList.toggle("light");
                    const icon = document.getElementById("themeIcon");
                    const isDark = document.documentElement.classList.contains("dark");
                    icon.className = isDark ? "fa-solid fa-moon text-lg" : "fa-solid fa-sun text-lg text-amber-400";
                });

                // Share Result
                this.shareBtn.addEventListener("click", () => {
                    const cpm = document.getElementById("finalCpm").textContent;
                    const acc = document.getElementById("finalAccuracy").textContent;
                    const text = `ネットミームタイピング2026の結果: スピード ${cpm} CPM | 正確率 ${acc}! #ネットミームタイピング2026 #タイピング`;
                    const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
                    window.open(url, '_blank');
                });
            }
        }

        // Initialize App on DOM Ready
        window.onload = () => {
            window.gameInstance = new TypingGame();
        };
    </script>
